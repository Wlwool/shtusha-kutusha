<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Shtusha-Kutusha</title>
  <defs>
    <clipPath id="mouth-clip">
      <path d="M86 160 Q128 206 170 160 Z"/>
    </clipPath>
  </defs>

  <!-- ножки -->
  <ellipse cx="82" cy="236" rx="20" ry="10" fill="#4b3fb0"/>
  <ellipse cx="174" cy="236" rx="20" ry="10" fill="#4b3fb0"/>

  <!-- звуковые дуги -->
  <g fill="none" stroke="#f5b82e" stroke-width="6" stroke-linecap="round">
    <path d="M26 40 Q16 56 26 72"/>
    <path d="M14 30 Q0 56 14 82"/>
    <path d="M230 40 Q240 56 230 72"/>
    <path d="M242 30 Q256 56 242 82"/>
  </g>

  <!-- колокольчики-рожки -->
  <g fill="#f5b82e" stroke="#2d2566" stroke-width="6" stroke-linejoin="round">
    <path d="M38 66 A32 32 0 0 1 102 66 Z" transform="rotate(-28 70 66)"/>
    <path d="M154 66 A32 32 0 0 1 218 66 Z" transform="rotate(28 186 66)"/>
    <rect x="120" y="30" width="16" height="22" rx="6"/>
  </g>

  <!-- корпус -->
  <circle cx="128" cy="140" r="92" fill="#6a5acd" stroke="#2d2566" stroke-width="6"/>
  <circle cx="128" cy="140" r="74" fill="#fff4dc" stroke="#2d2566" stroke-width="4"/>

  <!-- риски -->
  <g stroke="#2d2566" stroke-width="5" stroke-linecap="round">
    <path d="M128 70 V80"/>
    <path d="M128 200 V210"/>
    <path d="M62 140 H72"/>
    <path d="M184 140 H194"/>
  </g>

  <!-- брови -->
  <g stroke="#2d2566" stroke-width="7" stroke-linecap="round">
    <path d="M82 100 L112 108"/>
    <path d="M174 100 L144 108"/>
  </g>

  <!-- глаза -->
  <g stroke="#2d2566" stroke-width="4">
    <ellipse cx="98" cy="128" rx="15" ry="19" fill="#ffffff"/>
    <ellipse cx="158" cy="128" rx="15" ry="19" fill="#ffffff"/>
  </g>
  <circle cx="103" cy="132" r="8" fill="#2d2566"/>
  <circle cx="153" cy="132" r="8" fill="#2d2566"/>
  <circle cx="106" cy="128" r="2.6" fill="#ffffff"/>
  <circle cx="156" cy="128" r="2.6" fill="#ffffff"/>

  <!-- пасть -->
  <path d="M86 160 Q128 206 170 160 Z" fill="#2d2566" stroke="#2d2566" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#mouth-clip)">
    <ellipse cx="128" cy="184" rx="18" ry="9" fill="#ff7a8a"/>
    <path d="M96 160 L112 160 L104 174 Z" fill="#ffffff"/>
    <path d="M144 160 L160 160 L152 174 Z" fill="#ffffff"/>
  </g>
</svg>
