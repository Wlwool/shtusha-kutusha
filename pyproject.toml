[project]
name = "shtusha-kutusha"
version = "0.1.2"
description = "Discord reminder bot"
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.7.1",
    "aiohttp==3.14.4",
    "aiosqlite==0.22.1",
    "APScheduler==3.11.3",
    "dateparser==1.4.3",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["bot"]


[[tool.mypy.overrides]]
module = ["apscheduler.*", "dateparser"]
ignore_missing_imports = true
