[project]
name = "shtusha-kutusha"
version = "0.1.2"
description = "Discord reminder bot"
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.7.1",
    "aiohttp==3.14.4",
    "aiosqlite==0.21.0",
    "APScheduler==3.11.0",
    "dateparser==1.4.3",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
